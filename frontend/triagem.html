<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .btn-tv {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }
  .btn-tv:hover { background: #1e7e34; }

  .pacientes-fila {
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;
  }
  .pacientes-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pacientes-fila h3 span {
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }
  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff;
  }
  .fila-item strong { font-size: 15px; }
  .fila-item small { color: #888; font-size: 12px; }
  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  .btn-abrir-tv:hover { background: #117a8b; }
</style>
</head>

<body>
<div class="site-brand"><img src="assets/logo-campo-centro-oeste.svg" alt="Campo Centro Oeste" /></div>
<div class="container">

  <!-- Cabeçalho com botão da TV -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>

  <!-- Fila de pacientes do Atendimento criada para mostrar quem pode ser chamado na TV -->
  <div class="pacientes-fila">
    <h3>
      Pacientes Cadastrados no Atendimento
      <span>Clique em "Chamar na TV" para chamar ao guichê</span>
    </h3>
    <div id="fila-pacientes">
      <p style="color:#888; text-align:center;">Carregando...</p>
    </div>
    <button onclick="carregarPacientes()" style="margin-top:8px; background:#6c757d; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar lista</button>
  </div>

  <hr>

  <h3>Formulário de Triagem</h3>
  <input id="nome" placeholder="Nome do paciente">

  <select id="sintoma">
    <option value="">Selecione o sintoma</option>
    <option value="dor_leve">Dor leve</option>
    <option value="resfriado">Resfriado</option>
    <option value="coriza">Coriza</option>
    <option value="tosse">Tosse</option>
    <option value="febre">Febre</option>
    <option value="vomito">Vômito</option>
    <option value="diarreia">Diarreia</option>
    <option value="falta_ar_moderada">Falta de ar moderada</option>
    <option value="falta_ar_grave">Falta de ar grave</option>
    <option value="infarto">Suspeita de infarto</option>
    <option value="avc">Suspeita de AVC</option>
    <option value="convulsao">Convulsão</option>
    <option value="hemorragia">Hemorragia</option>
  </select>

  <input id="temp" type="number" placeholder="Temperatura">
  <input id="alergia" placeholder="Alergias">
  <textarea id="observacao" placeholder="Observações"></textarea>

  <div id="resultado"></div>
  <section id="painelIA" style="display:none;margin:16px 0;padding:16px;border:1px solid rgba(212,175,55,.4);border-radius:8px;background:rgba(20,20,17,.82);color:#f4ecd8;text-align:left;">
    <h3 style="margin-top:0;color:#d4af37;">🤖 Apoio inteligente à triagem</h3>
    <div id="conteudoIA"></div>
  </section>

  <button onclick="salvar()">Salvar Triagem</button>

</div>

<script>

function carregarPacientes() {
  fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {
      const div = document.getElementById("fila-pacientes");

      // Mostra apenas os com status "triagem"
      const fila = pacientes.filter(p => p.status === "triagem");

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando.</p>";
        return;
      }

      div.innerHTML = "";
      fila.forEach(p => {
        const item = document.createElement("div");
        item.className = "fila-item";
        item.innerHTML = `
          <div>
            <strong>${p.nome}</strong><br>
            <small>CPF: ${p.cpf || "—"} | Tipo: ${p.tipo || "—"}</small>
          </div>
          <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">📺 Chamar na TV</button>
        `;
        div.appendChild(item);
      });
    })
    .catch(() => {
      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:red;'>Erro ao carregar pacientes.</p>";
    });
}

// Função criada para enviar o nome do paciente para a TV quando ele for chamado no guichê.
function chamarNaTV(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "GUICHÊ",
      localNumero: "01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + " foi chamado na TV para o Guichê 01!");
  });
}

function classificarRisco(sintoma, temperatura) {
  const vermelhos = ["infarto","avc","convulsao","hemorragia","falta_ar_grave"];
  const amarelos = ["febre","vomito","diarreia","falta_ar_moderada"];
  if (temperatura >= 39 || vermelhos.includes(sintoma)) return "vermelho";
  if (temperatura >= 38 || amarelos.includes(sintoma)) return "amarelo";
  return "verde";
}

function escaparHTML(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exibirAvaliacaoIA(ia) {
  const painel = document.getElementById('painelIA');
  const conteudo = document.getElementById('conteudoIA');
  if (!ia) { painel.style.display = 'none'; return; }
  painel.style.display = 'block';
  conteudo.innerHTML = `
    <p><strong>Prioridade sugerida:</strong> ${escaparHTML((ia.prioridadeSugerida || 'não definida').toUpperCase())}</p>
    <p><strong>Por que essa prioridade?</strong> ${escaparHTML(ia.justificativa)}</p>
    <p><strong>Intervenção sugerida:</strong> ${escaparHTML(ia.intervencaoSugerida)}</p>
    <p><strong>Cuidados gerais:</strong> ${escaparHTML(ia.cuidadosGerais)}</p>
    <p><strong>Medicamentos:</strong> ${escaparHTML(ia.medicamento)}</p>
    <p><strong>Atenção:</strong> ${escaparHTML(ia.aviso)}</p>`;
}

async function salvar() {
  const nome = document.getElementById("nome").value.trim();
  const sintoma = document.getElementById("sintoma").value;
  const tempTexto = document.getElementById("temp").value;
  const temperatura = tempTexto === '' ? null : Number(tempTexto);
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();
  if (!nome || !sintoma) { alert('Informe o nome do paciente e selecione o sintoma.'); return; }
  try {
    const resposta = await fetch("/triagem", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, sintoma, temperatura, alergia, observacao, risco: classificarRisco(sintoma, temperatura ?? 0) })
    });
    const data = await resposta.json();
    if (!resposta.ok) throw new Error(data.erro || 'Não foi possível salvar a triagem.');
    const resultado = document.getElementById("resultado");
    resultado.className = data.risco;
    resultado.innerHTML = "Classificação registrada: " + escaparHTML(data.risco.toUpperCase());
    exibirAvaliacaoIA(data.avaliacaoIA);
    alert("Triagem salva com avaliação de apoio gerada.");
  } catch (e) { alert(e.message); }
}

// Carrega a fila ao abrir a página
carregarPacientes();

// Atualiza a lista automaticamente a cada 10 segundos
setInterval(carregarPacientes, 10000);

</script>

</body>
</html>
